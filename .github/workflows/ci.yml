name: CI

on:
  push:
    branches: [main, work/global-runtime-hardening]
  pull_request:

jobs:
  public-tls-acceptance:
    name: synthetic public TLS sharing acceptance
    if: github.ref == 'refs/heads/work/global-runtime-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install bridge dependencies
        run: npm ci --ignore-scripts --engine-strict
      - name: Download and verify the pinned disposable tunnel helper
        run: |
          curl --fail --location --max-time 60 --output "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64
          printf '%s  %s\n' '03f1f25d1cc93b9ad6c60569d44060bc4f17ed97075760ed8cfca4b12dcd68cc' "$RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/cloudflared"
      - name: Real HTTPS send fetch and remove using synthetic ciphertext only
        run: node test/integration/public-tls.mjs "$RUNNER_TEMP/cloudflared"
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install from lockfile
        run: npm ci --ignore-scripts --engine-strict
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Native Linux tmpfs fallback with missing-metadata simulation
        if: runner.os == 'Linux' && matrix.node == 24
        run: node test/integration/linux-tmpfs.mjs --simulate-missing-birthtime
      - name: Package hygiene (tarball allow-list)
        run: npm pack --dry-run

  installed-package:
    name: installed package node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18.18.0", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Intentionally no npm ci: acceptance must not borrow checkout dependencies.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        id: python
        with:
          python-version: "3.12"
      - name: Clean tarball installation and runtime acceptance
        env:
          BRIDGE_ACCEPTANCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:package

  native-pi-windows:
    name: native Pi 0.85.1 transport · windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install bridge dependencies
        run: npm ci --ignore-scripts --engine-strict
      - name: Install pinned experimental vendor in a disposable prefix
        run: npm install --prefix "$env:RUNNER_TEMP/bridge-native-pi" --ignore-scripts --engine-strict --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1
      - name: Install pinned test-only ConPTY driver outside the product
        run: npm install --prefix "$env:RUNNER_TEMP/bridge-test-pty" --no-audit --no-fund node-pty@1.1.0
      - name: Actual native launcher, queued migration and cross-device adoption
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:BRIDGE_TEST_RELOCATION_ROOT = $env:LOCALAPPDATA
          $env:BRIDGE_TEST_PTY_MODULE = "$env:RUNNER_TEMP/bridge-test-pty/node_modules/node-pty/lib/index.js"
          $env:BRIDGE_TEST_PI_BIN = "$env:RUNNER_TEMP/bridge-native-pi/node_modules/.bin"
          node test/integration/pi-native.mjs "$env:RUNNER_TEMP/bridge-native-pi/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --migrate --cross-device
      - name: Actual Windows TLS sharing and bounded transfer acceptance
        run: node test/integration/remote-tls.mjs
      - name: Actual Windows sealed publication interruption acceptance
        run: node test/integration/sealed-crash.mjs
      - name: Actual Windows shared quota and server recovery acceptance
        run: node test/integration/remote-store.mjs
      - name: Existing migration I/O failure and idempotent recovery matrix
        run: node test/integration/migration-io.mjs

  native-aider-windows:
    name: native Aider 0.86.2 acceptance · windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: npm ci --ignore-scripts --engine-strict
      - name: Install pinned experimental vendor in an isolated Python environment
        run: |
          python -m venv "$env:RUNNER_TEMP/bridge-native-aider"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe" -m pip install aider-chat==0.86.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe" -m pip check
      - name: Compile the local receiver fixture
        shell: powershell
        run: |
          Add-Type -TypeDefinition (Get-Content -Raw test/integration/windows-receiver.cs) -OutputAssembly "$env:RUNNER_TEMP/bridge-receiver.exe" -OutputType ConsoleApplication -ReferencedAssemblies System.Web.Extensions,System
      - name: Install pinned test-only ConPTY driver outside the product
        run: npm install --prefix "$env:RUNNER_TEMP/bridge-test-pty" --no-audit --no-fund node-pty@1.1.0
      - name: Actual native SDK cross-device adoption
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:BRIDGE_TEST_RELOCATION_ROOT = $env:LOCALAPPDATA
          $env:BRIDGE_TEST_TARGET_EXE = "$env:RUNNER_TEMP/bridge-receiver.exe"
          node test/integration/aider-native.mjs "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe" --cross-device
      - name: Diagnose native terminal interrupt delivery
        run: |
          $env:BRIDGE_TEST_PTY_MODULE = "$env:RUNNER_TEMP/bridge-test-pty/node_modules/node-pty/lib/index.js"
          node test/integration/windows-interrupt.mjs "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe"
      - name: Actual native SDK acceptance with a local fixture provider
        run: |
          $env:BRIDGE_TEST_TARGET_EXE = "$env:RUNNER_TEMP/bridge-receiver.exe"
          $env:BRIDGE_TEST_PTY_MODULE = "$env:RUNNER_TEMP/bridge-test-pty/node_modules/node-pty/lib/index.js"
          node test/integration/aider-native.mjs "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe" --interactive
