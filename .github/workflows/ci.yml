name: CI

on:
  push:
    branches: [main, work/global-runtime-hardening]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install from lockfile
        run: npm ci --ignore-scripts --engine-strict
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Package hygiene (tarball allow-list)
        run: npm pack --dry-run

  installed-package:
    name: installed package node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18.18.0", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Intentionally no npm ci: acceptance must not borrow checkout dependencies.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        id: python
        with:
          python-version: "3.12"
      - name: Clean tarball installation and runtime acceptance
        env:
          BRIDGE_ACCEPTANCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:package
