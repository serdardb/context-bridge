name: CI

on:
  push:
    branches: [main, work/global-runtime-hardening]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install from lockfile
        run: npm ci --ignore-scripts --engine-strict
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Native Linux tmpfs fallback with missing-metadata simulation
        if: runner.os == 'Linux' && matrix.node == 24
        run: node test/integration/linux-tmpfs.mjs --simulate-missing-birthtime
      - name: Package hygiene (tarball allow-list)
        run: npm pack --dry-run

  installed-package:
    name: installed package node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18.18.0", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Intentionally no npm ci: acceptance must not borrow checkout dependencies.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        id: python
        with:
          python-version: "3.12"
      - name: Clean tarball installation and runtime acceptance
        env:
          BRIDGE_ACCEPTANCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:package

  native-pi-windows:
    name: native Pi 0.85.1 transport · windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install bridge dependencies
        run: npm ci --ignore-scripts --engine-strict
      - name: Install pinned experimental vendor in a disposable prefix
        run: npm install --prefix "$env:RUNNER_TEMP/bridge-native-pi" --ignore-scripts --engine-strict --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1
      - name: Install pinned test-only ConPTY driver outside the product
        run: npm install --prefix "$env:RUNNER_TEMP/bridge-test-pty" --no-audit --no-fund node-pty@1.1.0
      - name: Actual native launcher and queued migration with a local fixture provider
        run: |
          $env:BRIDGE_TEST_PTY_MODULE = "$env:RUNNER_TEMP/bridge-test-pty/node_modules/node-pty/lib/index.js"
          $env:BRIDGE_TEST_PI_BIN = "$env:RUNNER_TEMP/bridge-native-pi/node_modules/.bin"
          node test/integration/pi-native.mjs "$env:RUNNER_TEMP/bridge-native-pi/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --migrate
      - name: Actual Windows TLS sharing and bounded transfer acceptance
        run: node test/integration/remote-tls.mjs
      - name: Actual Windows sealed publication interruption acceptance
        run: node test/integration/sealed-crash.mjs
      - name: Actual Windows shared quota and server recovery acceptance
        run: node test/integration/remote-store.mjs

  native-aider-windows:
    name: native Aider 0.86.2 acceptance · windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: npm ci --ignore-scripts --engine-strict
      - name: Install pinned experimental vendor in an isolated Python environment
        run: |
          python -m venv "$env:RUNNER_TEMP/bridge-native-aider"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe" -m pip install aider-chat==0.86.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe" -m pip check
      - name: Compile the local receiver fixture
        shell: powershell
        run: |
          Add-Type -TypeDefinition (Get-Content -Raw test/integration/windows-receiver.cs) -OutputAssembly "$env:RUNNER_TEMP/bridge-receiver.exe" -OutputType ConsoleApplication -ReferencedAssemblies System.Web.Extensions,System
      - name: Actual native SDK acceptance with a local fixture provider
        run: |
          $env:BRIDGE_TEST_TARGET_EXE = "$env:RUNNER_TEMP/bridge-receiver.exe"
          node test/integration/aider-native.mjs "$env:RUNNER_TEMP/bridge-native-aider/Scripts/python.exe"
